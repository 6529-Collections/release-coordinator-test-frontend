name: Sandbox checks
on:
  pull_request:
    branches: [main, 1a-staging, rehearsal-target]
permissions:
  contents: read
jobs:
  check:
    name: Sandbox check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Install locked package
        run: npm ci --ignore-scripts
      - name: Run application checks
        run: npm test
      - name: Build application artifact
        env:
          SANDBOX_SOURCE_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Upload application artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandbox-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}-frontend
          path: dist
          if-no-files-found: error
          retention-days: 7
