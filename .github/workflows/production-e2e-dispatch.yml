name: Production E2E Dispatch

on:
  workflow_run:
    workflows: ["Web Deploy - PROD"]
    types: [completed]
    branches: [main]

permissions: {}

run-name: Production E2E dispatch [${{ github.event.workflow_run.id }}]

concurrency:
  group: production-e2e-dispatch-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch-successful-deploy:
    name: Dispatch successful production deployment
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch exact successful deploy to production E2E
        env:
          DEPLOY_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          runs_file="$(mktemp)"
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-e2e.yml/runs" \
            -f branch=main -f event=workflow_dispatch \
            -f created=">=${DEPLOY_CREATED_AT}" -f per_page=100 > "$runs_file"
          existing="$(jq -er --arg title "Production E2E automatic ${DEPLOY_RUN_ID}" \
            '[.workflow_runs[] | select(.display_title == $title)] | length' "$runs_file")"
          if [ "$existing" -gt 1 ]; then
            echo "Multiple E2E runs already exist for deploy ${DEPLOY_RUN_ID}." >&2
            exit 1
          fi
          if [ "$existing" = 1 ]; then
            echo "The exact E2E run already exists."
            exit 0
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-e2e.yml/dispatches" \
            --input - <<JSON
          {"ref":"main","inputs":{"automatic_deploy_run_id":"${DEPLOY_RUN_ID}"}}
          JSON
